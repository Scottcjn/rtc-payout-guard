[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "rtc-payout-guard"
version = "0.1.0"
description = "Verification guards for RTC bounty payouts: wallets, star claims, review bounties, duplicate payments, amount mismatches"
readme = "README.md"
requires-python = ">=3.9"
license = "AGPL-3.0-or-later"
authors = [{ name = "Elyan Labs LLC" }]
dependencies = ["requests>=2.28"]

[project.scripts]
rtc-guard = "rtc_payout_guard.cli:entrypoint"

[project.optional-dependencies]
dev = ["pytest>=7"]

[tool.setuptools]
packages = ["rtc_payout_guard"]

[tool.pytest.ini_options]
testpaths = ["tests"]
